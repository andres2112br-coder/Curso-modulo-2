<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ejercicio 10 - Tarjeta de Perfil</title>
  <link rel="stylesheet" href="./ejercicios_css_basicos.css" />
</head>
<body>
  <h1>Tarjeta de Perfil</h1>

  <main style="display:flex;justify-content:center;">
    <section class="tarjeta-perfil">
      <img
        class="tarjeta-perfil__imagen"
        src="https://i.pinimg.com/736x/39/cf/0b/39cf0b894a193b7e534ad059246fb8ee.jpg"
        alt="Imagen de perfil"
      />

      <div class="tarjeta-perfil__contenido">
        <h3 class="tarjeta-perfil__nombre">Andres Barros</h3>
        <p class="tarjeta-perfil__bio">
          Desarrollador web con pasión por el diseño y la programación. Me gusta crear interfaces
          simples, responsivas y fáciles de usar.
        </p>

        <ul class="tarjeta-perfil__redes">
          <li>
            <a href="https://www.instagram.com/andresfbrr?igsh=MXJraGYzaTJieGZ1Ng==" aria-label="Instagram">Instagram</a>
          </li>
          <li>
            <a href="#" aria-label="Twitter">Twitter</a>
          </li>
          <li>
            <a href="#" aria-label="LinkedIn">LinkedIn</a>
          </li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
