<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora Cientifica</title>
        <link rel="stylesheet" href="Calculadora Sin IA.css">
        <script src="Calculadora Sin IA.js" defer></script>
    </head>
    <body>

        <div class="main-container">

            <div class="title-wrapper">
                <span class="main-title">Calculadora Científica</span>
            </div>

            <div class="calculator-grid">

                <div class="output">
                    <div data-previous-operand class="previous-operand"></div>
                    <div data-current-operand class="current-operand">0</div>
                </div>

                <button data-clear class="func-btn span-two-h">AC</button>
                <button data-delete class="func-btn">DEL</button>
                <button data-operation="^" class="op-btn">x<sup>y</sup></button>

                <button data-function="sin" class="func-btn">sin</button>
                <button data-function="cos" class="func-btn">cos</button>
                <button data-function="tan" class="func-btn">tan</button>
                <button data-function="√" class="func-btn">√</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button data-operation="÷" class="op-btn">÷</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button data-operation="x" class="op-btn">×</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button data-operation="-" class="op-btn">−</button>

                <button data-number="0" class="span-two-h">0</button>
                <button data-number=".">.</button>
                <button data-operation="+" class="op-btn">+</button>

                <button data-equal class="equal-btn span-four-h">=</button>

            </div>

            <p class="footer-label">© 2026 Calculadora Científica — Puede correr Doom si te lo propones</p>

        </div>

    </body>
</html>
